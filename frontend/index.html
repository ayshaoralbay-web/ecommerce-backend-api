<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Tracks</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 p-6 min-h-screen font-sans text-gray-900">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 1. HEADER SECTION -->
    <div class="bg-white border-2 border-black p-4 rounded shadow">
      <h1 class="text-2xl font-bold uppercase">🎵 Music Tracks</h1>
      <p id="total-count" class="text-gray-600 font-bold text-sm mt-1">Loading...</p>
    </div>

    <!-- 2. FILTERS & SORTING -->
    <div class="bg-white border-2 border-black p-4 rounded shadow grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block font-bold text-xs uppercase mb-1">Search:</label>
        <input id="search-input" type="text" placeholder="Song or artist..." class="w-full border-2 border-black p-2 font-bold text-sm outline-none" />
      </div>
      <div>
        <label class="block font-bold text-xs uppercase mb-1">Genre:</label>
        <select id="genre-filter" class="w-full border-2 border-black p-2 font-bold text-sm outline-none">
          <option value="all">All</option>
          <option value="pop">pop</option>
          <option value="rock">rock</option>
          <option value="alternative">alternative</option>
          <option value="hip-hop">hip-hop</option>
          <option value="r&b">r&b</option>
        </select>
      </div>
      <div>
        <label class="block font-bold text-xs uppercase mb-1">Sort by:</label>
        <select id="sort-select" class="w-full border-2 border-black p-2 font-bold text-sm outline-none">
          <option value="id-asc">By order (ID)</option>
          <option value="title-asc">Name (A-Z)</option>
          <option value="title-desc">Name (Z-A)</option>
          <option value="year-desc">Year (Newest)</option>
          <option value="year-asc">Year (Oldest)</option>
        </select>
      </div>
    </div>

    <!-- 3. TRACKS GRID -->
    <div id="tracks-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>

    <!-- 4. PAGINATION -->
    <div class="bg-white border-2 border-black p-4 rounded shadow flex items-center justify-between">
      <button id="prev-btn" class="bg-yellow-300 hover:bg-yellow-400 border-2 border-black font-bold px-4 py-2 text-sm">← Previous</button>
      <span id="page-info" class="font-bold text-sm">Page 1 / 1</span>
      <button id="next-btn" class="bg-yellow-300 hover:bg-yellow-400 border-2 border-black font-bold px-4 py-2 text-sm">Next →</button>
    </div>

    <!-- 5. ADD NEW TRACK FORM -->
    <div class="bg-white border-2 border-black p-6 rounded shadow">
      <h2 class="text-xl font-bold mb-4 uppercase">Add a new song</h2>
      <form id="add-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input name="title" type="text" placeholder="Song name *" required class="border-2 border-black p-2 font-bold text-sm" />
        <input name="artist" type="text" placeholder="Artist *" required class="border-2 border-black p-2 font-bold text-sm" />
        <input name="genre" type="text" placeholder="Genre (pop, rock...)" class="border-2 border-black p-2 font-bold text-sm" />
        <input name="year" type="number" placeholder="Year" value="2024" class="border-2 border-black p-2 font-bold text-sm" />
        <input name="image" type="url" placeholder="Image URL" class="border-2 border-black p-2 font-bold text-sm sm:col-span-2" />
        <button type="submit" class="bg-emerald-400 hover:bg-emerald-500 border-2 border-black font-bold p-2 text-sm sm:col-span-2">Add Song</button>
      </form>
    </div>

  </div>

  <script>
    const API_URL = "http://localhost:5001";
    let currentPage = 1;

    // A. FETCH AND DISPLAY TRACKS
    async function loadTracks() {
      const search = document.getElementById("search-input").value;
      const genre = document.getElementById("genre-filter").value;
      const sortValue = document.getElementById("sort-select").value;

      // Split sort option (e.g., "title-asc" -> sort="title", order="asc")
      const [sort, order] = sortValue.split("-");

      // Construct API URL
      const url = `${API_URL}/tracks?q=${search}&genre=${genre}&sort=${sort}&order=${order}&page=${currentPage}&limit=6`;

      const res = await fetch(url);
      const { data, meta } = await res.json();

      // Update total count and page info
      document.getElementById("total-count").textContent = `${meta.total} songs found`;
      document.getElementById("page-info").textContent = `Page ${meta.page} / ${meta.totalPages}`;

      // Handle pagination buttons
      document.getElementById("prev-btn").disabled = meta.page <= 1;
      document.getElementById("next-btn").disabled = meta.page >= meta.totalPages;

      // Render cards
      const grid = document.getElementById("tracks-grid");
      grid.innerHTML = "";

      if (data.length === 0) {
        grid.innerHTML = "<p class='col-span-full font-bold text-center py-6'>No songs found</p>";
        return;
      }

      data.forEach((track) => {
        const card = document.createElement("div");
        card.className = "bg-white border-2 border-black p-3 relative shadow";
        card.innerHTML = `
          <button onclick="deleteTrack(${track.id})" class="absolute top-2 left-2 bg-red-600 text-white text-xs font-bold px-2 py-1 border border-black">
            Delete
          </button>
          <img src="${track.image || 'https://picsum.photos/300'}" class="w-full aspect-square object-cover border border-black" />
          <h3 class="font-bold text-lg mt-2 truncate">${track.title}</h3>
          <p class="text-gray-600 text-sm font-bold">${track.artist}</p>
          <span class="inline-block text-xs font-bold bg-yellow-300 border border-black px-2 py-0.5 mt-2">${track.genre}</span>
        `;
        grid.appendChild(card);
      });
    }

    // B. DELETE TRACK
    async function deleteTrack(id) {
      if (confirm("Are you sure you want to delete this track?")) {
        await fetch(`${API_URL}/tracks/${id}`, { method: "DELETE" });
        loadTracks();
      }
    }

    // C. ADD NEW TRACK
    document.getElementById("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);

      await fetch(`${API_URL}/tracks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      e.target.reset();
      loadTracks();
    });

    // D. PAGINATION HANDLERS
    document.getElementById("prev-btn").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        loadTracks();
      }
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      currentPage++;
      loadTracks();
    });

    // E. RESET TO PAGE 1 ON FILTER / SEARCH CHANGE
    ["search-input", "genre-filter", "sort-select"].forEach((id) => {
      document.getElementById(id).addEventListener("input", () => {
        currentPage = 1;
        loadTracks();
      });
    });

    // Load tracks on initial load
    loadTracks();
  </script>
</body>
</html>
